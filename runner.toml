[[action]]
label = "Build"
cmd   = "cmake --build build"
desc  = "Compile runner and its tests"
group = "Dev"

[[action]]
label = "Test"
cmd   = "./build/runner_tests"
desc  = "Run the doctest suite"
group = "Dev"

[[action]]
label = "Configure"
cmd   = "cmake -S . -B build"
desc  = "Re-run CMake configure"
group = "Dev"

# Composite: `sequence` runs the listed actions in order (stopping on the first
# failure). Actions are referenced by their unique `label`. See also the
# per-action `depends_on = [...]` and `only_if_cmd = "..."` fields.
[[action]]
label = "Check (build + test)"
sequence = ["Build", "Test"]
desc  = "Build, then run the test suite; stops if the build fails"
group = "Dev"

# --- Release ---------------------------------------------------------------
# Phase A bumps the version everywhere, commits, and creates a LOCAL tag. Push
# the tag yourself (git push origin vX.Y.Z), then run the checksum refresh.
[[action]]
label = "Release: bump major (X.Y.Z→X.Y+1.0)"
cmd   = "scripts/bump-version.sh major"
desc  = "Bump the middle version number, update all packaging files, commit + local tag"
group = "Release"

[[action]]
label = "Release: bump minor (X.Y.Z→X.Y.Z+1)"
cmd   = "scripts/bump-version.sh minor"
desc  = "Bump the last version number, update all packaging files, commit + local tag"
group = "Release"

[[action]]
label = "Release: refresh checksums"
cmd   = "scripts/refresh-checksums.sh"
desc  = "After pushing the tag: fetch the release tarball, update AUR/Void/Homebrew/Nix checksums, commit"
group = "Release"

[[action]]
label = "Truecolor demo"
cmd   = "printf '\\033[38;2;255;128;0mtruecolor orange\\033[0m \\033[38;5;39m256-blue\\033[0m\\n'"
desc  = "Prints a truecolor and a 256-color span"
group = "Demo"

[[action]]
label = "Env demo"
cmd   = "echo \"BOARD=$BOARD PATH_HEAD=${PATH%%:*}\""
desc  = "Echoes an injected var"
group = "Demo"
env   = { BOARD = "leg" }

[[action]]
label = "Build Void package"
cmd   = 'mkdir -p "$HOME/void-packages/srcpkgs/runner" && cp packaging/void/template "$HOME/void-packages/srcpkgs/runner/template" && cd "$HOME/void-packages" && ./xbps-src clean runner && ./xbps-src -Q pkg runner && ls -la hostdir/binpkgs/runner-*.xbps'
desc  = "Sync the template into ~/void-packages and build the .xbps (runs tests)"
group = "Packaging"

[[action]]
label = "Void: install built package"
cmd   = 'sudo xbps-install -R "$HOME/void-packages/hostdir/binpkgs" -y runner && runner --version'
desc  = "Install/upgrade runner from the locally built .xbps (needs passwordless sudo); run after Build Void package"
group = "Packaging"

# --- AUR (Arch) ------------------------------------------------------------
# Needs: makepkg + the AUR ftxui dep installed (see packaging/aur/README.md).
[[action]]
label = "AUR: build package"
cmd   = "makepkg -f"
desc  = "Build the AUR package; check() runs the doctest suite"
group = "Packaging"
cwd   = "packaging/aur"

[[action]]
label = "AUR: regen .SRCINFO"
cmd   = "makepkg --printsrcinfo > .SRCINFO && echo 'wrote packaging/aur/.SRCINFO'"
desc  = "Regenerate .SRCINFO after editing PKGBUILD"
group = "Packaging"
cwd   = "packaging/aur"

[[action]]
label = "AUR: namcap lint"
cmd   = "namcap PKGBUILD; for p in runner-*.pkg.tar.zst; do [ -e \"$p\" ] && namcap \"$p\"; done"
desc  = "Lint the PKGBUILD (and built package, if present) with namcap"
group = "Packaging"
cwd   = "packaging/aur"

# --- Nix -------------------------------------------------------------------
# Needs: the nix CLI with flakes enabled.
[[action]]
label = "Nix: build"
cmd   = "nix build .#runner --print-build-logs && ./result/bin/runner --version"
desc  = "Build the flake's default package and print its version"
group = "Packaging"

[[action]]
label = "Nix: flake check"
cmd   = "nix flake check --print-build-logs"
desc  = "Evaluate the flake and build its checks"
group = "Packaging"

[[action]]
label = "Nix: lock"
cmd   = "nix flake lock && echo 'wrote flake.lock'"
desc  = "Pin nixpkgs by generating flake.lock"
group = "Packaging"

# --- Debian / Ubuntu -------------------------------------------------------
# Runs inside a debian:sid podman container (scripts/deb-podman.sh) so the .deb
# can be built/linted/inspected from a non-Debian host (e.g. Void). The image
# (runner-debsid) is built once and cached; `podman rmi runner-debsid` forces a
# rebuild against newer sid packages. On a real Debian 14+/Ubuntu host you can
# instead run packaging/debian/build.sh directly (see packaging/debian/README.md).
[[action]]
label = "Debian: build .deb"
cmd   = "scripts/deb-podman.sh 'WORK=/src/dist/deb packaging/debian/build.sh'"
desc  = "In a debian:sid container: assemble debian/ onto the release tarball and build the .deb (runs tests)"
group = "Packaging"

[[action]]
label = "Debian: lint .deb"
cmd   = "scripts/deb-podman.sh scripts/deb-lint.sh"
desc  = "In a debian:sid container: run lintian on the most recently built .deb"
group = "Packaging"

[[action]]
label = "Debian: inspect .deb"
cmd   = "scripts/deb-podman.sh scripts/deb-inspect.sh"
desc  = "In a debian:sid container: show metadata, runtime Depends, and file list of the built .deb"
group = "Packaging"

# --- Homebrew --------------------------------------------------------------
# Needs: brew with the ftxui/tomlplusplus formulae available (see packaging/homebrew/README.md).
[[action]]
label = "Homebrew: build formula"
cmd   = "brew install --build-from-source ./runner.rb && runner --version"
desc  = "Build+install the formula from source against Homebrew's ftxui"
group = "Packaging"
cwd   = "packaging/homebrew"

[[action]]
label = "Homebrew: audit formula"
cmd   = "brew audit --strict --formula ./runner.rb && echo 'audit OK'"
desc  = "Lint the Homebrew formula with brew audit"
group = "Packaging"
cwd   = "packaging/homebrew"
